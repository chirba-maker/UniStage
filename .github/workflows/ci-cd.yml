name: UniStage CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # =========================================================================
  # 1. Tests & Compilation Back-End (Spring Boot / JUnit 5)
  # =========================================================================
  backend-tests:
    name: Back-end Tests & Build (JUnit 5 / Mockito)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Unit & Integration Tests
        run: |
          cd unistage-backend
          mvn clean test -B

  # =========================================================================
  # 2. Tests & Compilation Front-End (Angular / Vitest)
  # =========================================================================
  frontend-tests:
    name: Front-end Tests & Build (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: unistage-frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd unistage-frontend
          npm ci

      - name: Run Frontend Vitest Unit Tests
        run: |
          cd unistage-frontend
          npm run test:ci

      - name: Build Frontend Production Artifacts
        run: |
          cd unistage-frontend
          npm run build -- --configuration production

  # =========================================================================
  # 3. Validation des Builds Docker Multi-stage
  # =========================================================================
  docker-build:
    name: Build & Validate Docker Containers
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./unistage-backend
          file: ./unistage-backend/Dockerfile
          push: false
          tags: unistage-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./unistage-frontend
          file: ./unistage-frontend/Dockerfile
          push: false
          tags: unistage-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Docker Compose Configuration
        run: |
          cp .env.example .env
          docker compose config
