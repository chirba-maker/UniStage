version: '3.8'

services:
  # =========================================================================
  # 1. Base de données relationnelle : MySQL 8.0
  # =========================================================================
  database:
    image: mysql:8.0
    container_name: unistage-mysql
    restart: always
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-unistage_db}
      MYSQL_USER: ${MYSQL_USER:-unistage_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-unistage_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secure_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./unistage_db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - unistage-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_secure_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # =========================================================================
  # 2. Back-end API REST : Spring Boot 3.2+
  # =========================================================================
  backend:
    build:
      context: ./unistage-backend
      dockerfile: Dockerfile
    container_name: unistage-backend
    restart: always
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://database:3306/${MYSQL_DATABASE:-unistage_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-unistage_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-unistage_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-c2VjdXJlX3VuaXN0YWdlX2p3dF9zZWNyZXRfa2V5XzIwMjZfbGFiZV9ndWluZWVfcHJvZHVjdGlvbl8zMmJ5dGVz}
      APP_JWT_EXPIRATION_MS: ${APP_JWT_EXPIRATION_MS:-86400000}
      APP_JWT_REFRESH_EXPIRATION_MS: ${APP_JWT_REFRESH_EXPIRATION_MS:-604800000}
      APP_FILE_STORAGE_DIR: ${APP_FILE_STORAGE_DIR:-/app/uploads}
      SERVER_PORT: ${SERVER_PORT:-8080}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - unistage-network

  # =========================================================================
  # 3. Front-end SPA : Angular 17+ / Nginx
  # =========================================================================
  frontend:
    build:
      context: ./unistage-frontend
      dockerfile: Dockerfile
    container_name: unistage-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - unistage-network

# =========================================================================
# Volumes persistants & Réseau isolé
# =========================================================================
volumes:
  mysql_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  unistage-network:
    driver: bridge
