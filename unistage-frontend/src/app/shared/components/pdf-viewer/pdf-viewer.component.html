@if (isOpen) {
  <div class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/80 backdrop-blur-md flex items-center justify-center p-2 sm:p-4 animate-fade-in">
    <div class="bg-slate-900 border border-slate-700/60 rounded-2xl shadow-2xl w-full max-w-5xl h-[90vh] flex flex-col overflow-hidden text-slate-100 transform transition-all duration-300 scale-100">
      
      <!-- Header -->
      <div class="px-6 py-4 bg-slate-800/80 border-b border-slate-700/60 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-blue-600/20 text-blue-400 flex items-center justify-center border border-blue-500/30">
            <lucide-icon [img]="icons.FileText" class="w-5 h-5"></lucide-icon>
          </div>
          <div>
            <h3 class="font-bold text-lg text-white leading-tight">{{ title }}</h3>
            <p class="text-xs text-slate-400">Université de Labé — Visualiseur de document PDF</p>
          </div>
        </div>

        <div class="flex items-center gap-2">
          @if (rawBlobUrl) {
            <button 
              (click)="openInNewTab()"
              title="Ouvrir dans un nouvel onglet"
              class="px-3 py-1.5 rounded-lg bg-slate-700/60 hover:bg-slate-700 text-slate-200 hover:text-white text-xs font-medium transition flex items-center gap-1.5 border border-slate-600/50">
              <lucide-icon [img]="icons.ExternalLink" class="w-3.5 h-3.5"></lucide-icon>
              <span>Plein écran</span>
            </button>

            <button 
              (click)="downloadPdf()"
              title="Télécharger le PDF"
              class="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium transition flex items-center gap-1.5 shadow-sm shadow-blue-500/30">
              <lucide-icon [img]="icons.Download" class="w-3.5 h-3.5"></lucide-icon>
              <span>Télécharger</span>
            </button>
          }

          <button 
            (click)="closeModal()"
            title="Fermer la fenêtre"
            class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white transition ml-2 border border-slate-700">
            <lucide-icon [img]="icons.X" class="w-5 h-5"></lucide-icon>
          </button>
        </div>
      </div>

      <!-- PDF Container -->
      <div class="flex-1 bg-slate-950 relative flex items-center justify-center overflow-hidden">
        @if (safeUrl) {
          <iframe 
            [src]="safeUrl" 
            class="w-full h-full border-0 rounded-b-2xl bg-white"
            title="Prévisualisation PDF">
          </iframe>
        } @else {
          <div class="flex flex-col items-center justify-center p-8 text-center text-slate-400">
            <div class="w-16 h-16 rounded-2xl bg-slate-800/80 flex items-center justify-center text-slate-500 mb-4 animate-pulse">
              <lucide-icon [img]="icons.FileText" class="w-8 h-8"></lucide-icon>
            </div>
            <p class="text-sm font-medium text-slate-300 mb-2">Chargement du document PDF en cours...</p>
            <p class="text-xs text-slate-500">Veuillez patienter pendant la préparation de la prévisualisation.</p>
          </div>
        }
      </div>

    </div>
  </div>
}
