@if (isOpen) {
  <div class="modal fade show d-block" tabindex="-1" style="background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(4px); z-index: 1055;">
    <div class="modal-dialog modal-xl modal-dialog-centered" style="max-width: 92%; height: 90vh;">
      <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden h-100">
        
        <!-- Header -->
        <div class="modal-header bg-dark text-white border-bottom border-secondary px-4 py-3">
          <div class="d-flex align-items-center gap-3">
            <span class="fs-4">📄</span>
            <div>
              <h5 class="modal-title fw-bold text-white mb-0">{{ title }}</h5>
              <small class="text-white-50">Université de Labé — Visualiseur de document PDF officiel</small>
            </div>
          </div>

          <div class="d-flex align-items-center gap-2">
            @if (rawBlobUrl) {
              <button (click)="openInNewTab()" class="btn btn-outline-light btn-sm rounded-3 fw-semibold">
                <span>↗ Plein écran</span>
              </button>
              <button (click)="downloadPdf()" class="btn btn-primary btn-sm rounded-3 fw-semibold">
                <span>📥 Télécharger</span>
              </button>
            }
            <button (click)="closeModal()" class="btn-close btn-close-white ms-2" aria-label="Close"></button>
          </div>
        </div>

        <!-- Body -->
        <div class="modal-body p-0 bg-dark position-relative h-100 overflow-hidden" style="min-height: 500px;">
          @if (safeUrl) {
            <iframe 
              [src]="safeUrl" 
              class="w-100 h-100 border-0 bg-white"
              style="min-height: 500px;"
              title="Prévisualisation PDF">
            </iframe>
          } @else {
            <div class="d-flex flex-column align-items-center justify-content-center h-100 p-5 text-white-50">
              <div class="spinner-border text-primary mb-3" role="status"></div>
              <p class="fw-semibold text-white mb-1">Chargement du document PDF en cours...</p>
              <small>Veuillez patienter pendant la génération et préparation de la prévisualisation.</small>
            </div>
          }
        </div>

      </div>
    </div>
  </div>
}
